<!-- SVG -> Scalable Vector graphics( for graphics and having sharp button at various sizes) , embedding the SVG within the src attribute of the <img> tag -->

<svg
  width="100"
  height="40"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Rectangle for the button background -->
  <rect
    width="20"
    height="20"
     rx="5" 
      <!-- Rounded corners -->
    fill="rgb(248, 239, 143)"  <!-- Button background color -->
  

  <!-- Text for the "Copy" label -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="middle"
    text-anchor="middle"
    fill="black"  <!-- Text color -->
    font-size="16"  <!-- Text size -->
  
    Copy
  </text>
</svg>
